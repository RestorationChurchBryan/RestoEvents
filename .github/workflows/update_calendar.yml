
name: Auto-update iCal File

on:
  schedule:
    - cron: '0 7 * * 0'  # Every Sunday at 7:00 AM UTC
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install ics beautifulsoup4 requests pytz

      - name: Run Script
        run: python generate_calendar.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git pull origin main
          "[ -f restoration_calendar.ics ] && git add restoration_calendar.ics || echo 'No .ics file to add'"
          git commit -m 'Auto-update calendar [bot]' || echo "No changes to commit"
          git push

